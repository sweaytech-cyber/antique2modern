  <style>
    :root{--bg:#09090b;--surface:#141418;--hover:#1f1f24;--line:rgba(255,255,255,.08);--white:#fff;--secondary:#a1a1aa;--muted:#71717a;--sans:'Plus Jakarta Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:.9rem 2.2rem;background:rgba(9,9,11,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:var(--white)}
    .brand-mark{width:36px;height:36px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800}
    .brand-name{font-size:1.3rem;font-weight:800}
    .brand-tag{font: .68rem var(--mono);padding:2px 7px;border:1px solid var(--line);border-radius:8px;color:var(--secondary)}
    .search{position:relative;flex:1;max-width:480px}
    .search input{width:100%;padding:.68rem 2.5rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:#fff;font:.9rem var(--sans);outline:none}
    .search input:focus{border-color:rgba(255,255,255,.5);background:var(--hover)}
    .actions{display:flex;gap:.65rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.6rem 1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#fff;font:600 .85rem var(--sans);text-decoration:none;white-space:nowrap;cursor:pointer}
    .btn:hover{background:var(--hover);border-color:rgba(255,255,255,.22)}
    .btn svg{flex-shrink:0}
    .search-icon{position:absolute;left:.9rem;top:50%;width:16px;height:16px;transform:translateY(-50%);fill:#71717a;pointer-events:none}
    .kbd-hint{position:absolute;right:.8rem;top:50%;transform:translateY(-50%);padding:2px 6px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.06);color:var(--muted);font: .7rem var(--mono);pointer-events:none}
    main{width:100%;max-width:1400px;margin:0 auto;padding:1.8rem 2.2rem 3rem;flex:1}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:1.8rem}
    .categories{display:flex;align-items:center;gap:.55rem;overflow-x:auto;padding-bottom:.3rem;scrollbar-width:thin}
    .category{padding:.52rem 1.1rem;border:1px solid var(--line);border-radius:9999px;background:var(--surface);color:var(--secondary);font:.84rem var(--sans);white-space:nowrap;cursor:pointer;transition:all .2s ease}
    .category:hover{border-color:rgba(255,255,255,.22);background:var(--hover);color:#fff}
    .category.active{border-color:#fff;background:#fff;color:#000;font-weight:700}
    .count{flex-shrink:0;color:var(--muted);font:.8rem var(--mono)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.3rem}
    .movie{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s}
    .movie:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.5);background:var(--hover);box-shadow:0 12px 30px rgba(0,0,0,.7)}
    .poster{display:block;width:100%;height:135px;object-fit:cover;background:#202024;transition:transform .4s ease}
    .movie:hover .poster{transform:scale(1.08)}
    .movie-content{display:flex;flex:1;flex-direction:column;justify-content:space-between;padding:.95rem}
    .movie-title{display:-webkit-box;margin-bottom:.6rem;overflow:hidden;color:var(--white);font-size:.95rem;font-weight:700;line-height:1.35;-webkit-box-orient:vertical;-webkit-line-clamp:2}
    .movie-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
    .movie-badge{padding:2px 8px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.05);color:var(--secondary);font-size:.72rem}
    .movie-arrow{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:translateX(-4px);transition:all .25s}
    .movie:hover .movie-arrow{opacity:1;transform:translateX(0)}
    footer{display:flex;justify-content:space-between;gap:1rem;padding:1.4rem 2.2rem;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
    @media(max-width:760px){header{flex-wrap:wrap;padding:.8rem 1rem;gap:.7rem}.brand{order:0}.actions{order:1;margin-left:auto}.search{order:2;max-width:none;flex-basis:100%}main{padding:1.1rem 1rem 2rem}.controls{align-items:flex-start;flex-direction:column}.categories{width:100%;margin-right:-1rem;padding-right:1rem}.count{align-self:flex-end}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.8rem}.poster{height:110px}footer{padding:1.1rem 1rem;flex-wrap:wrap}}
  </style>
</head>

    const categories = ['All', 'Movies', 'TV Shows', 'Animation', 'Action', 'Comedy', 'Horror', 'Sci-Fi'];
    const tvTitles = new Set(['Naruto Manga','Invincible','Attack on Titan','Everybody Hates Chris','Breaking Bad','Hajime no Ippo','Squid Game S1 E1','Wednesday','The Boondocks','Squid Game Season 1','Infinity Train','The O.C. Season 1','The O.C. Season 2','The O.C. Season 3','The O.C. Season 4','Brooklyn Nine-Nine','The Summer I Turned Pretty Season 1','Looking for Alaska','Star vs. the Forces of Evil','Dan Vs.','It\'s Always Sunny in Philadelphia Season 2','MST3K: The Deadly Bees','Squid Game Season 2']);
    const tagGroups = {
      Animation: new Set(['Naruto Manga','Attack on Titan','Hajime no Ippo','Invincible','The Boondocks','Spider-Man: Into the Spider-Verse','Despicable Me','Despicable Me 2','Kung Fu Panda','Kung Fu Panda 2','Toy Story','Toy Story 2','Toy Story 3','Toy Story 4','Garfield: The Movie (Animated)','The Lorax','The Incredibles','Dog Man','Alvin and the Chipmunks: The Squeakquel','Alvin and the Chipmunks: Chipwrecked','Astro Boy','Captain Underpants: The First Epic Movie','Minions: The Rise of Gru','Megamind','Wreck-It Ralph','The Super Mario Bros. Movie','Hotel Transylvania','WALL-E','Inside Out','Inside Out 2','Moana','Zootopia','Sonic 3','Sonic the Hedgehog 2']),
      Action: new Set(['Pirates of the Caribbean: Dead Men\'s Chest','Pirates of the Caribbean: On Stranger Tides','Spider-Man: Homecoming','Avengers: Infinity War','Avengers: Endgame','Iron Man','The Dark Knight','Thor','Dog Man','The Mechanic','Batman v Superman: Dawn of Justice','Die Hard 2','Tomb Raider','Terminator 3: Rise of the Machines','Blade','Thor: The Dark World','The Avengers','Avengers: Age of Ultron','Bad Boys','Bad Boys II','Deadpool','Guardians of the Galaxy Vol. 2','Black Adam','Venom','Venom: Let There Be Carnage','Venom: The Last Dance','Ant-Man and the Wasp','Black Panther','Ant-Man','The Fast and the Furious','Ride Along','The Dukes of Hazzard','Jarhead','Transformers One']),
      Comedy: new Set(['Diary of a Wimpy Kid','Everybody Hates Chris','Ghostbusters','Garfield: The Movie','Despicable Me','Despicable Me 2','Kung Fu Panda','Kung Fu Panda 2','Toy Story','Toy Story 2','Toy Story 3','Toy Story 4','Home Alone','Ratatouille','The Simpsons Movie','The Lorax','The Incredibles','Dog Man','Goodfellas','Daddy Daycare','Dumb and Dumber','Barbershop','Captain Underpants: The First Epic Movie','The Super Mario Bros. Movie','Minions: The Rise of Gru','Megamind','Wreck-It Ralph','Hotel Transylvania','The Adventures of Sharkboy and Lavagirl','Diary of a Wimpy Kid: Dog Days','Matilda','Ramona and Beezus','Judy Moody and the Not Bummer Summer']),
      Horror: new Set(['Scream','Requiem for a Dream','Coraline','The Blair Witch Project','Jaws','Donnie Darko','The Shining','Scream 4','Halloween II','Prometheus','Alien vs. Predator','The Crazies','REC 4: Apocalypse','We Are Still Here']),
      'Sci-Fi': new Set(['The Matrix','Star Wars: The Last Jedi','Star Wars: The Force Awakens','Transformers One','Back to the Future','Fantastic Beasts: The Crimes of Grindelwald','Astro Boy','Infinity Train','Prometheus','Alien vs. Predator','The Avengers','Avengers: Age of Ultron','The Terminator','WALL-E'])
    };
    const genreForTitle = title => Object.entries(tagGroups).find(([, titlesInGroup]) => titlesInGroup.has(title))?.[0] || (tvTitles.has(title) ? 'TV Shows' : 'Drama');
    let activeCategory = 'All';
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    function renderCategories() {
      document.getElementById('categories').innerHTML = categories.map(category => `<button class="category ${category === activeCategory ? 'active' : ''}" type="button" aria-pressed="${category === activeCategory}" onclick="filterCategory('${category}')">${category}</button>`).join('');
    }
    function filterCategory(category) {
      activeCategory = category;
      renderCategories();
      render();
    }
    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = titles.map((title, index) => ({ title, index })).filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(query);
        const matchesCategory = activeCategory === 'All' ||
          (activeCategory === 'Movies' && !tvTitles.has(item.title)) ||
          (activeCategory === 'TV Shows' && tvTitles.has(item.title)) ||
          Boolean(tagGroups[activeCategory]?.has(item.title));
        return matchesSearch && matchesCategory;
      });
      document.getElementById('count').textContent = `${visible.length} titles`;
      grid.innerHTML = visible.map(({ title, index }) => {
        const image = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(`${title} movie poster`)}&w=500&h=700&c=7&rs=1&p=0`;
        const destination = videoLinks[index];
        return `<a class="movie" href="${destination}" target="_blank" rel="noopener noreferrer"><img class="poster" src="${image}" alt="${title} poster" loading="lazy"><div class="movie-content"><span class="movie-title">${title}</span><div class="movie-footer"><span class="movie-badge">${genreForTitle(title)}</span><svg class="movie-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div></div></a>`;
      }).join('');
    }
    search.addEventListener('input', render);
    document.addEventListener('keydown', event => {
      if (event.key === '/' && document.activeElement !== search) {
        event.preventDefault();
        search.focus();
      }
    });
    renderCategories();
    render();
