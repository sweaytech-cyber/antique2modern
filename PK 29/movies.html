<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PK29 Movies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#09090b;--surface:#141418;--hover:#1f1f24;--line:rgba(255,255,255,.08);--white:#fff;--secondary:#a1a1aa;--muted:#71717a;--sans:'Plus Jakarta Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:.9rem 2.2rem;background:rgba(9,9,11,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:var(--white)}
    .brand-mark{width:36px;height:36px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800}
    .brand-name{font-size:1.3rem;font-weight:800}
    .brand-tag{font: .68rem var(--mono);padding:2px 7px;border:1px solid var(--line);border-radius:8px;color:var(--secondary)}
    .search{position:relative;flex:1;max-width:480px}
    .search input{width:100%;padding:.68rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:#fff;font: .9rem var(--sans);outline:none}
    .search input:focus{border-color:rgba(255,255,255,.5);background:var(--hover)}
    .actions{display:flex;gap:.65rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:.6rem 1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#fff;font:600 .85rem var(--sans);text-decoration:none;white-space:nowrap}
    .btn:hover{background:var(--hover);border-color:rgba(255,255,255,.22)}
    main{width:100%;max-width:1400px;margin:0 auto;padding:1.8rem 2.2rem 3rem;flex:1}
    .controls{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.8rem}
    .controls h1{font-size:1.35rem;font-weight:700}
    .count{font:.8rem var(--mono);color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.3rem}
    .movie{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,background .2s}
    .movie:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.4);background:var(--hover)}
    .poster{width:100%;height:220px;object-fit:cover;background:#202024}
    .movie-title{padding:.85rem .9rem;min-height:3.6rem;font-size:.9rem;font-weight:700;line-height:1.35}
    footer{display:flex;justify-content:space-between;gap:1rem;padding:1.4rem 2.2rem;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
    @media(max-width:760px){header{flex-wrap:wrap;padding:.8rem 1rem;gap:.7rem}.brand{order:0}.actions{order:1;margin-left:auto}.search{order:2;max-width:none;flex-basis:100%}main{padding:1.1rem 1rem 2rem}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.8rem}.poster{height:180px}footer{padding:1.1rem 1rem;flex-wrap:wrap}}
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="brand"><span class="brand-mark">PK</span><span class="brand-name">PK29</span><span class="brand-tag">v2.0</span></a>
    <label class="search"><input id="search" type="search" placeholder="Search movies and shows..." aria-label="Search movies and shows"></label>
    <nav class="actions" aria-label="Site navigation"><a class="btn" href="index.html">Games</a><a class="btn" href="movies.html" aria-current="page">Movies</a><a class="btn" href="index.html#settingsOverlay">Settings</a></nav>
  </header>
  <main>
    <div class="controls"><h1>Movies &amp; Shows</h1><span class="count" id="count"></span></div>
    <section class="grid" id="grid" aria-label="Movies and shows"></section>
  </main>
  <footer><span>PK29 Vault</span><span>Movies &amp; Shows</span></footer>
  <script>
    const titles = [
      'Naruto Manga','Invincible','Minecraft Movie','Attack on Titan','Diary of a Wimpy Kid','Everybody Hates Chris','Ghostbusters','Breaking Bad','Titanic','Karate Kid','Garfield: The Movie','Hajime no Ippo','Pirates of the Caribbean: Dead Men\'s Chest','Pirates of the Caribbean: On Stranger Tides','Attack on Titan','Scream','Requiem for a Dream','Squid Game S1 E1','Star Wars: The Last Jedi','Star Wars: The Force Awakens','The Grand Budapest Hotel','Puss in Boots: The Last Wish','The Boondocks','Inside Out','Moana','Zootopia','Transformers One','Coraline',
      'Spider-Man: Into the Spider-Verse','Despicable Me','Despicable Me 2','Kung Fu Panda','Kung Fu Panda 2','Toy Story','Toy Story 2','Toy Story 3','Toy Story 4','Spider-Man: Homecoming','Avengers: Infinity War','Avengers: Endgame','Sonic 3','Home Alone','Ratatouille','Iron Man','Wednesday','The Dark Knight','The Blair Witch Project','The Simpsons Movie','Back to the Future','Garfield: The Movie (Animated)','The Lorax','Thor','The Incredibles','Squid Game Season 1',
      'Dog Man','Goodfellas','Daddy Daycare','Percy Jackson: Sea of Monsters','The Matrix','Alvin and the Chipmunks: The Squeakquel','Alvin and the Chipmunks: Chipwrecked','Percy Jackson: The Lightning Thief','The Mechanic','Dumb and Dumber','Batman v Superman: Dawn of Justice','Die Hard 2','Tomb Raider','Terminator 3: Rise of the Machines','High School Musical 2','The Polar Express','Barbershop','Astro Boy','Fantastic Beasts: The Crimes of Grindelwald','Blade','Captain Underpants: The First Epic Movie','Thor: The Dark World','The Avengers','Avengers: Age of Ultron',
      'Jaws','Hacksaw Ridge','Bad Boys','Bad Boys II','Infinity Train','Donnie Darko','Seven','Pulp Fiction','The Shining','Deadpool','The Super Mario Bros. Movie','Guardians of the Galaxy Vol. 2','Girl, Interrupted','Thirteen','Mid90s','Bodies Bodies Bodies','American Psycho','Black Adam','Minions: The Rise of Gru','Megamind','Wreck-It Ralph','Venom','Venom: Let There Be Carnage','Venom: The Last Dance','Squid Game Season 2',
      'Ant-Man and the Wasp','Black Panther','Ant-Man','Scream 4','Halloween II','The O.C. Season 1','The O.C. Season 2','The O.C. Season 3','The O.C. Season 4','Brooklyn Nine-Nine','The Summer I Turned Pretty Season 1','Looking for Alaska','Boiler Room','How High','Prometheus','Alien vs. Predator','The Crazies','Scarface','Final Destination','REC 4: Apocalypse','Hotel Transylvania','Sonic the Hedgehog 2',
      'We Are Still Here','The Fast and the Furious','Ride Along','The Dukes of Hazzard','Red Dragon','Jarhead','Zathura','The Adventures of Sharkboy and Lavagirl','Diary of a Wimpy Kid: Dog Days','Matilda','Ramona and Beezus','Judy Moody and the Not Bummer Summer','Star vs. the Forces of Evil','Dan Vs.','It\'s Always Sunny in Philadelphia Season 2','MST3K: The Deadly Bees','WALL-E','Inside Out 2'
    ];
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = titles.filter(title => title.toLowerCase().includes(query));
      document.getElementById('count').textContent = `${visible.length} titles`;
      grid.innerHTML = visible.map(title => {
        const image = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(`${title} movie poster`)}&w=500&h=700&c=7&rs=1&p=0`;
        const destination = `https://www.google.com/search?q=${encodeURIComponent(`${title} movie`)}`;
        return `<a class="movie" href="${destination}" target="_blank" rel="noopener noreferrer"><img class="poster" src="${image}" alt="${title} poster" loading="lazy"><span class="movie-title">${title}</span></a>`;
      }).join('');
    }
    search.addEventListener('input', render);
    render();
  </script>
</body>
</html>
