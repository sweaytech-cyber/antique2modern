  <style>
    :root{--bg:#09090b;--surface:#141418;--hover:#1f1f24;--line:rgba(255,255,255,.08);--white:#fff;--secondary:#a1a1aa;--muted:#71717a;--sans:'Plus Jakarta Sans',-apple-system,sans-serif;--mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1.5rem;padding:.9rem 2.2rem;background:rgba(9,9,11,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:.85rem;text-decoration:none;color:var(--white)}
    .brand-mark{width:36px;height:36px;border-radius:8px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800}
    .brand-name{font-size:1.3rem;font-weight:800}
    .brand-tag{font: .68rem var(--mono);padding:2px 7px;border:1px solid var(--line);border-radius:8px;color:var(--secondary)}
    .search{position:relative;flex:1;max-width:480px}
    .search input{width:100%;padding:.68rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:#fff;font: .9rem var(--sans);outline:none}
    .search input:focus{border-color:rgba(255,255,255,.5);background:var(--hover)}
    .actions{display:flex;gap:.65rem}
    .btn{display:inline-flex;align-items:center;justify-content:center;padding:.6rem 1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:#fff;font:600 .85rem var(--sans);text-decoration:none;white-space:nowrap}
    .btn:hover{background:var(--hover);border-color:rgba(255,255,255,.22)}
    main{width:100%;max-width:1400px;margin:0 auto;padding:1.8rem 2.2rem 3rem;flex:1}
    .controls{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1.8rem}
    .controls h1{font-size:1.35rem;font-weight:700}
    .count{font:.8rem var(--mono);color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1.3rem}
    .movie{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:transform .2s,border-color .2s,background .2s}
    .movie:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.4);background:var(--hover)}
    .poster{width:100%;height:220px;object-fit:cover;background:#202024}
    .movie-title{padding:.85rem .9rem;min-height:3.6rem;font-size:.9rem;font-weight:700;line-height:1.35}
    footer{display:flex;justify-content:space-between;gap:1rem;padding:1.4rem 2.2rem;background:var(--surface);border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
    @media(max-width:760px){header{flex-wrap:wrap;padding:.8rem 1rem;gap:.7rem}.brand{order:0}.actions{order:1;margin-left:auto}.search{order:2;max-width:none;flex-basis:100%}main{padding:1.1rem 1rem 2rem}.grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:.8rem}.poster{height:180px}footer{padding:1.1rem 1rem;flex-wrap:wrap}}
  </style>
</head>

    const grid = document.getElementById('grid');

    function render() {
      const query = search.value.trim().toLowerCase();
      const visible = titles.map((title, index) => ({ title, index })).filter(item => item.title.toLowerCase().includes(query));
      document.getElementById('count').textContent = `${visible.length} titles`;
      grid.innerHTML = visible.map(({ title, index }) => {
        const image = `https://tse2.mm.bing.net/th?q=${encodeURIComponent(`${title} movie poster`)}&w=500&h=700&c=7&rs=1&p=0`;
        const destination = videoLinks[index];
        return `<a class="movie" href="${destination}" target="_blank" rel="noopener noreferrer"><img class="poster" src="${image}" alt="${title} poster" loading="lazy"><span class="movie-title">${title}</span></a>`;
      }).join('');
    }
    search.addEventListener('input', render);
    render();
