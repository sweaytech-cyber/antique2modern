<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
</head>
<body>
<div id="container">
  <iframe id="fr" title="2048" width="100%" height="100%" frameborder="0" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
  <button class="play-button" type="button" onclick="PlayTo(this)">CLICK TO PLAY</button>
  <p id="unblocked-text">G+</p>
  <button class="fullscreen-button" type="button" onclick="openFullscreen()">FULLSCREEN</button>
</div>

<style>
  #container { width: 100%; height: 100%; position: relative; }
  #fr { display: none; border: 0; }
  .play-button { padding: 20px 40px; background: #000; color: #fff; border: 2px solid #4a148c; border-radius: 10px; font: bold 24px Arial; cursor: pointer; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; }
  .play-button:hover { background: #4a148c; }
  .fullscreen-button { padding: 10px 15px; background: #000; color: #fff; border: 2px solid #4a148c; border-radius: 5px; font: bold 14px Arial; cursor: pointer; position: fixed; bottom: 20px; right: 20px; z-index: 1002; }
  .fullscreen-button:hover { background: #4a148c; }
  body, html { margin: 0; padding: 0; overflow: hidden; height: 100%; }
</style>

<script>
  const DB_NAME = 'GameCacheDB';
  const STORE_NAME = 'GameFiles';
  const CACHE_DURATION = 90 * 24 * 60 * 60 * 1000; // 3 ay
  const FILE_URL = 'https://cdn.jsdelivr.net/gh/familiapablo/lopx@main/gol.xml';
  const GAME_BASE_URL = new URL('.', FILE_URL).href;

  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        db.createObjectStore(STORE_NAME, { keyPath: 'url' });
      };
      request.onsuccess = (event) => resolve(event.target.result);
      request.onerror = (event) => reject(event.target.error);
    });
  }

  async function saveToCache(url, content) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction(STORE_NAME, 'readwrite');
      const store = transaction.objectStore(STORE_NAME);
      const request = store.put({ url: url, content: content, timestamp: Date.now() });
      request.onsuccess = () => resolve();
      request.onerror = () => reject(new Error('Cache error'));
    });
  }

  async function getFileFromCache(url) {
    try {
      const db = await openDB();
      const cached = await new Promise((resolve, reject) => {
        const request = db.transaction(STORE_NAME, 'readonly').objectStore(STORE_NAME).get(url);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      if (cached && (Date.now() - cached.timestamp) < CACHE_DURATION) return cached.content;
    } catch (err) {
      console.warn('Game cache unavailable; loading from network.', err);
    }

    const response = await fetch(url);
    if (!response.ok) throw new Error(`Game request failed: ${response.status}`);
    const text = await response.text();
    try {
      await saveToCache(url, text);
    } catch (err) {
      console.warn('Game cache could not be updated.', err);
    }
    return text;
  }

  function extractGameHtml(payload) {
    const xml = new DOMParser().parseFromString(payload, 'application/xml');
    const content = xml.querySelector('Content');
    if (!content || xml.querySelector('parsererror')) {
      throw new Error('The game response did not contain a valid game document.');
    }

    const html = content.textContent;
    const baseTag = `<base href="${GAME_BASE_URL}">`;
    return /<head(?:\s[^>]*)?>/i.test(html)
      ? html.replace(/<head(?:\s[^>]*)?>/i, (head) => `${head}${baseTag}`)
      : `${baseTag}${html}`;
  }

  function PlayTo(button) {
    const iframe = document.getElementById("fr");
    getFileFromCache(FILE_URL).then((payload) => {
      iframe.srcdoc = extractGameHtml(payload);
      iframe.style.display = "block";
      button.style.display = "none";
    }).catch((err) => {
      console.error('Error:', err);
      alert('Oyun yüklenemedi.');
    });
  }

  async function openFullscreen() {
    const newWindow = window.open("", "_blank");
    if (!newWindow) {
      alert('Tam ekran açılamadı.');
      return;
    }

    try {
      const payload = await getFileFromCache(FILE_URL);
      newWindow.document.open();
      newWindow.document.write(extractGameHtml(payload));
      newWindow.document.close();
    } catch (err) {
      newWindow.close();
      console.error('Error:', err);
      alert('Tam ekran yüklenemedi.');
    }
  }
</script>
</body>
</html>
